buildscript {
	dependencies {
		classpath "org.kohsuke:github-api:1.330"
	}
}

plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "com.diffplug.spotless" version "8.4.0"
}

def ENV = System.getenv()

// ── Auto-incrementing jar version ────────────────────────────────────────
// The jar is named after mod_version, and any build that actually produces a
// jar bumps it first, so a fresh jar never lands in the mods folder under the
// name of the one already sitting there. The patch digit rolls over at 9, so
// v7.56.9 is followed by v7.57.0.
//
// mod_version is written back to gradle.properties, which is a configuration
// input - that invalidates the configuration cache, so the next build
// re-reads it and bumps again instead of reusing the old number.
def bumpModVersion() {
	def propsFile = file("gradle.properties")
	def text = propsFile.text
	def matcher = text =~ /mod_version=v(\d+)\.(\d+)\.(\d+)(-MC[^\r\n]*)/

	// Leave anything that isn't a plain v<major>.<minor>.<patch> alone, e.g.
	// the v7.5X.X placeholder upstream builds from.
	if (!matcher.find())
		return project.mod_version

	def major = matcher.group(1) as int
	def minor = matcher.group(2) as int
	def patch = (matcher.group(3) as int) + 1
	if (patch > 9) {
		patch = 0
		minor++
	}

	def bumped = "v${major}.${minor}.${patch}${matcher.group(4)}"
	propsFile.text = text.replaceFirst(/mod_version=v[^\r\n]*/, "mod_version=${bumped}")
	return bumped
}

def jarProducingTasks = ["assemble", "build", "jar", "remapJar", "github"]
def buildsAJar = gradle.startParameter.taskNames.any {
	jarProducingTasks.contains(it.substring(it.lastIndexOf(":") + 1))
}

version = buildsAJar ? bumpModVersion() : project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// net.wurstclient.ai.PathPos extends net.minecraft.util.math.BlockPos,
	// which uses javax.annotation.concurrent.Immutable, which is part of
	// the JSR305 library.
	//
	// In other words, Wurst won't compile without this library,
	// even though it's Minecraft that actually uses it.
	implementation "com.google.code.findbugs:jsr305:3.0.2"
}

fabricApi.configureTests {
	createSourceSet = true
	enableGameTests = false
	enableClientGameTests = true
	modId = "wurst_testmod"
	username = "Wurst-Bot"
}

// ── Screenshot templates for the client gametests ───────────────────────
// Upstream compares its screenshots against images on Imgur that show
// Wurst's branding, which nothing in this fork matches. Beast keeps its own
// templates in the repo instead, and re-records them on demand:
//
//   ./gradlew runClientGameTest -PupdateScreenshots
//
// That run never fails a comparison; it overwrites every template with what
// the client actually drew, keeping the old alpha masks. Check `git diff` on
// the templates afterwards, because it happily records a bug as the new
// expectation.
def screenshotTemplateDir = file("src/gametest/screenshot_templates")
def updateScreenshots = project.hasProperty("updateScreenshots")

// Only some of the gametests: -Ponly=mace,scaffold (see gametest.cmd)
def onlyTests = project.findProperty("only")

// Only some parts of a test (-Pparts=fight,rematch) and fight videos
// (-Precord) - a quick round on one fight instead of the whole test
def testParts = project.findProperty("parts")
def recordFights = project.hasProperty("record")

// The test client's memory (user, 2026-10-17: "set a memory limit, it was
// using 5GB"): a 2 GB heap at most (it was 3), started small; unused heap
// given back to Windows after each collection and every 10 s instead of
// kept; compact object headers (JDK 25: smaller objects); compiled code
// capped. What's left on top of the heap is Minecraft's own native memory
// (textures, LWJGL buffers, class metadata).
def gameTestJvmFlags = ["-Xms512M", "-Xmx2G", "-XX:+UseG1GC",
	"-XX:MaxGCPauseMillis=50", "-XX:+ParallelRefProcEnabled",
	"-XX:+UseCompactObjectHeaders", "-XX:+UseStringDeduplication",
	"-XX:G1PeriodicGCInterval=10000", "-XX:MinHeapFreeRatio=10",
	"-XX:MaxHeapFreeRatio=25", "-XX:ReservedCodeCacheSize=192M"]

loom {
	accessWidenerPath = file("src/main/resources/wurst.accesswidener")

	runs {
		clientGameTest {
			// Less RAM, short pauses (user, 2026-10-16: "optimize the JVM
			// flags"): G1 with a 1-3 GB heap, compact object headers (JDK
			// 25: smaller objects), deduplicated strings, unused heap given
			// back to Windows every 15 s.
			gameTestJvmFlags.each { vmArg(it) }
			vmArg("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
			vmArg("-Dwurst.test.templateDir=$screenshotTemplateDir")
			if (onlyTests)
				vmArg("-Dwurst.test.only=$onlyTests")
			if (testParts)
				vmArg("-Dwurst.test.parts=$testParts")
			if (recordFights)
				vmArg("-Dwurst.test.record=true")
			if (updateScreenshots)
				vmArg("-Dwurst.test.updateTemplates=true")
		}

		clientWithMods {
			inherit client
		}
		
		clientGameTestWithMods {
			inherit client
			source = sourceSets.gametest
			runDir = "build/run/clientGameTestWithMods"
			vmArg("-Dfabric.client.gametest")
			vmArg("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
			vmArg("-Dwurst.test.withMods=true")
			vmArg("-Dwurst.test.templateDir=$screenshotTemplateDir")
			if (onlyTests)
				vmArg("-Dwurst.test.only=$onlyTests")
			if (updateScreenshots)
				vmArg("-Dwurst.test.updateTemplates=true")
			programArg("--username=Wurst-Bot")
		}
	}
}

configurations {
	testMods {
		transitive = false
	}
}

dependencies {
	testMods "maven.modrinth:sodium:${project.sodium_version}"
}

def cleanClientWithMods = tasks.register("cleanClientWithMods", Delete) {
	delete "run/mods"
}

def prepareClientWithMods = tasks.register("prepareClientWithMods", Sync) {
	from configurations.testMods
	into "run/mods"
}

tasks.named("runClientWithMods") {
	dependsOn prepareClientWithMods
	finalizedBy cleanClientWithMods
}

def cleanClientGameTestWithMods = tasks.register("cleanClientGameTestWithMods", Delete) {
	delete layout.buildDirectory.dir("run/clientGameTestWithMods")
}

def prepareClientGameTestWithMods = tasks.register("prepareClientGameTestWithMods", Sync) {
	dependsOn cleanClientGameTestWithMods
	from configurations.testMods
	into layout.buildDirectory.dir("run/clientGameTestWithMods/mods")
}

// VexBot (a server-side PvP bot mod, MIT) for the gametests: AimAssistComboTest
// and the Grim server's AimAssist (Auto combo) test fight one of its bots
// instead of a husk. The jar isn't on any maven, so it comes from -PvexbotJar
// (default: ../vexbot-3.0.14mc26.1.2.jar) and goes only into the test client's
// mods folder and the Grim test server's (gradle/anticheat.gradle). VexBot
// posts usage stats to its author's server every few seconds by default;
// vexbot_settings.json (read from the server directory when the world
// starts) switches that off.
ext.vexbotJar = file(project.findProperty("vexbotJar") ?: "../vexbot-3.0.14mc26.1.2.jar")
def vexbotJar = ext.vexbotJar
def prepareVexbot = tasks.register("prepareVexbot") {
	def runDir = layout.buildDirectory.dir("run/clientGameTest").get().asFile
	inputs.property("jar", vexbotJar.path)
	// Fabric's deleteGameTestRunDir wipes the run dir before every run
	mustRunAfter "deleteGameTestRunDir"
	doLast {
		def mods = new File(runDir, "mods")
		mods.mkdirs()
		mods.listFiles().findAll { it.name.startsWith("vexbot") }*.delete()
		if (!vexbotJar.isFile()) {
			logger.warn("VexBot jar not found at $vexbotJar - AimAssistComboTest will fail (-PvexbotJar=...)")
			return
		}
		new File(runDir, "vexbot_settings.json").text = '{"global": {"statsOn": false, "difficulty": "PERFECT", "jumpResetChance": 100, "counterStunChance": 100, "strafeInCombo": true}}\n'
		java.nio.file.Files.copy(vexbotJar.toPath(), new File(mods, vexbotJar.name).toPath())
	}
}
// Performance mods and the lowest graphics for the gametest client (user,
// 2026-10-16: "all visual settings ... absolute lowest to save ram", "sodium,
// lithium, ferritecore, modernfix ... and all performance mods in my personal
// mods folder"). The jars are copied (never moved or changed) from
// -PperfModsDir, default the user's .minecraft/mods; -PnoPerfMods runs
// without them. Not Dynamic FPS: it lowers the frame rate while the window
// is in the background, and the test client runs at most one tick per frame.
// Not lite-cpu: it throttles chunk rebuilds whatever its config says (log:"profile:
// aggressive"), and screenshots raced block changes (in_game without the wall).
// Not Moonrise: with it, closing the test world deadlocked Fabric's harness
// (render thread in IntegratedServer.halt, server thread parked in the
// harness's phaser) on the first run; without it, it closed fine.
// The options leave alone what features under test change or need to show:
// vignette, view bobbing, hurt tilt, screen/FOV effects, gamma, FOV, GUI
// scale (NoVignette, AntiWobble, NoHurtcam, Fullbright, the ClickGUI...).
def perfModsDir = file(project.findProperty("perfModsDir")
	?: "${System.getenv("APPDATA")}/.minecraft/mods")
def usePerfMods = !project.hasProperty("noPerfMods")
def perfMods = [
	// rendering
	"sodium-fabric-", "sodium-extra-fabric-", "ImmediatelyFast-",
	"entityculling-fabric-", "moreculling-fabric-", "cullleaves-fabric-",
	"bzbe-fabric-", "particle_core-",
	// memory, loading
	"ferritecore-", "modernfix-", "smoothjoin-",
	// game logic, the integrated server
	"lithium-fabric-", "BzadOptimizations-", "debugify-",
	// network, input
	"krypton-", "Ixeris-", "fast-ip-ping-",
	// what they need
	"cloth-config-", "fzzy_config-", "fabric-language-kotlin-"]
def lowGraphics = """version:4790
renderDistance:2
simulationDistance:5
graphicsPreset:"custom"
cutoutLeaves:false
improvedTransparency:false
ao:false
entityShadows:false
particles:2
mipmapLevels:0
biomeBlendRadius:0
textureFiltering:0
renderClouds:"false"
weatherRadius:3
entityDistanceScaling:0.5
menuBackgroundBlurriness:0
chunkSectionFadeInTime:0.0
enableVsync:false
inactivityFpsLimit:"minimized"
"""
def preparePerfMods = tasks.register("preparePerfMods") {
	def runDir = layout.buildDirectory.dir("run/clientGameTest").get().asFile
	inputs.property("dir", perfModsDir.path)
	inputs.property("enabled", usePerfMods)
	mustRunAfter "deleteGameTestRunDir"
	doLast {
		runDir.mkdirs()
		new File(runDir, "options.txt").text = lowGraphics
		if (!usePerfMods)
			return
		def mods = new File(runDir, "mods")
		mods.mkdirs()
		def jars = (perfModsDir.listFiles() ?: []).findAll { f ->
			f.name.endsWith(".jar") && perfMods.any { f.name.startsWith(it) }
		}
		def missing = perfMods.findAll { p -> !jars.any { it.name.startsWith(p) } }
		if (missing)
			logger.warn("Performance mods not in $perfModsDir: $missing")
		jars.each {
			java.nio.file.Files.copy(it.toPath(), new File(mods, it.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
		logger.lifecycle("Gametest client: ${jars.size()} performance mods, lowest graphics")
	}
}
tasks.named("runClientGameTest") {
	dependsOn prepareVexbot
	dependsOn preparePerfMods
}

def doModCompatTest = providers.gradleProperty("do_mod_compat_test").map { it.toBoolean() }.orElse(false)
tasks.named("runClientGameTestWithMods") {
	onlyIf { doModCompatTest.get() }
	dependsOn prepareClientGameTestWithMods
}

processResources {
	def modVersion = project.version.substring(1)
	inputs.property("version", modVersion)
	
	filesMatching("fabric.mod.json") {
		expand(version: modVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.1 (26.1-snapshot-1) upwards uses Java 25.
	it.options.release = 25
	// -Pmaxerrs=N: list more than javac's default 100 errors
	if(project.hasProperty("maxerrs"))
		it.options.compilerArgs += ["-Xmaxerrs", project.property("maxerrs").toString()]
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def archivesName = project.base.archivesName
	inputs.property("archivesName", archivesName)
	
	from("LICENSE.txt") {
		rename { "LICENSE-${archivesName.get()}.txt" }
	}
	
	exclude("intentionally_untranslated.json")
}

import com.diffplug.spotless.generic.LicenseHeaderStep
spotless {
	lineEndings = "WINDOWS"
	java {
		removeUnusedImports()
		leadingSpacesToTabs()
		trimTrailingWhitespace()
		eclipse().configFile(file("codestyle/formatter.xml"))
	}
	format("licenseHeader") {
		target("src/*/java/**/*.java")
		def header_file = file("codestyle/license_header.txt")
		def delimiter = LicenseHeaderStep.DEFAULT_JAVA_HEADER_DELIMITER
		licenseHeaderFile(header_file, delimiter).updateYearWithLatest(true)
	}
	json {
		target("src/**/*.json", "src/**/*.mcmeta")
		gson().indentWithSpaces(2).version("2.11.0")
	}
}

test {
	useJUnitPlatform()
}

// AimAssist's "Neural network": trains it in a sword PvP simulator (src/test
// .../hacks/aimassist/neural/NeuralTrainer) and writes
// src/main/resources/assets/wurst/neural/aimassist_pvp.bin.
// gradlew trainNeuralAim [-PnnArgs="train 26,8,10 2000"] (or "sweep 300" to
// compare network shapes, "probe" for the scripted fighters).
tasks.register("trainNeuralAim", JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "net.wurstclient.hacks.aimassist.neural.NeuralTrainer"
	maxHeapSize = "1g"
	workingDir = projectDir
	args((project.findProperty("nnArgs") ?: "train 26,8,10 2000").toString().split(" "))
}

def getGhVersion() {
	return version.substring(0, version.indexOf("-MC"))
}

def getChangelogLink(String platform, String from) {
	def versionSlug = getGhVersion().substring(1).replace(".", "-")
	def shortURL = "https://www.wurstclient.net/updates/wurst-${versionSlug}/"
	def query = []
	if (platform != "GitHub")
		query.add("mc=${project.minecraft_version}")
	query.add("utm_source=${platform}")
	query.add("utm_medium=" + project.archives_base_name.replace("-", "+"))
	def fullURL = shortURL + (query.isEmpty() ? "" : "?" + query.join("&"))
	def encodedURL = java.net.URLEncoder.encode(fullURL, "UTF-8")
	return "[${shortURL}](https://go.wimods.net/from/${from}?to=${encodedURL})"
}

def getChangelogImage(String from) {
	return "![](https://img.wimods.net/${from})"
}

def getChangelog(String platform, String from) {
	def prefix = platform == "GitHub" ? "" : "A changelog can be found at: "
	def imgQuery = platform == "GitHub" ? "" : "?mc_version=${project.minecraft_version}&mod_loader=${project.mod_loader}"
	return prefix + getChangelogLink(platform, from) + getChangelogImage(from + imgQuery)
}

import org.kohsuke.github.GHReleaseBuilder
import org.kohsuke.github.GitHub

task github(dependsOn: build) {
	onlyIf {
		ENV.GITHUB_TOKEN
	}
	
	doLast {
		def github = GitHub.connectUsingOAuth(ENV.GITHUB_TOKEN as String)
		def repoId = project.mcx_repo_id
		def repository = github.getRepository(repoId)
		def ghVersion = getGhVersion()
		
		def ghRelease = repository.getReleaseByTagName(ghVersion as String)
		if(ghRelease == null) {
			def releaseBuilder = new GHReleaseBuilder(repository, ghVersion as String)
			releaseBuilder.body(getChangelogImage("github.com/${repoId}/releases/tag/${ghVersion}"))
			releaseBuilder.prerelease(ghVersion.contains("pre"))
			ghRelease = releaseBuilder.create()
		}
		
		ghRelease.uploadAsset(jar.archiveFile.get().getAsFile(), "application/java-archive")
		ghRelease.uploadAsset(sourcesJar.archiveFile.get().getAsFile(), "application/java-archive")
	}
}

import org.kohsuke.github.GHIssueState
import org.kohsuke.github.GHMilestoneState
import java.time.Instant

task closeMilestone {
	onlyIf {
		ENV.GITHUB_TOKEN
	}
	
	doLast {
		def github = GitHub.connectUsingOAuth(ENV.GITHUB_TOKEN as String)
		def repoId = project.gh_repo_id
		def repository = github.getRepository(repoId)
		def ghVersion = getGhVersion()
		
		// Weird API design: listMilestones() requires GHIssueState while everything else uses GHMilestoneState.
		def milestone = repository.listMilestones(GHIssueState.ALL).find { it.title == ghVersion }
		if (milestone == null) {
			milestone = repository.createMilestone(ghVersion, "")
		}
		
		if (milestone.getState() != GHMilestoneState.CLOSED) {
			milestone.setDueOn(Date.from(Instant.now()))
			milestone.setDescription(getChangelog("GitHub", "github.com/${repoId}/milestone/${ghVersion}"))
			milestone.close()
		}
	}
}

// real anticheat servers (Grim, Intave) for the gametests
apply from: "gradle/anticheat.gradle"
