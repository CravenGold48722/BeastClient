# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these at https://fabricmc.net/develop/ and
# https://modrinth.com/mod/fabric-api/versions
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Fabric API
fabric_api_version=0.155.3+26.1.2

# Mod Properties
# Bumped automatically by build.gradle every time a jar is built, so no two
# jars in the mods folder can end up with the same name. This is the version
# of the LAST jar that was built.
mod_version=v7.63.9-MC26.1.2
maven_group=net.wurstclient
archives_base_name=Beast-Client
mod_loader=Fabric

# GitHub
gh_repo_id=CravenGold48722/BeastClient
mcx_repo_id=Wurst-Imperium/Wurst-MCX2

# Dependencies
# check at https://modrinth.com/mod/sodium/version/mc26.1.2
sodium_version=mc26.1.2-0.9.2-fabric
do_mod_compat_test=true
