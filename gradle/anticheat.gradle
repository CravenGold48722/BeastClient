def prepareShardServer = tasks.register("prepareShardServer", PrepareTestServer) {
	dependsOn buildShard, downloadPaperServer
	useServer = useShard
	serverDir = new File(anticheatDir, "shard")
	serverJar.from(downloadPaperServer.flatMap { it.destination })
	serverJarName = "paper.jar"
	addons.from(fileTree(new File(shardSource, "build/libs")) {
		include "Shard-*.jar"
		exclude "*-thin.jar"
	})
	addonDir = "plugins"
	patchGrim = false
	freshDirs = ["world", "world_nether", "world_the_end", "logs",
		"plugins/Shard"]
	def shardConfig = { String name ->
		useShard ? new File(shardSource, "src/main/resources/" + name)
			.getText("UTF-8") : ""
	}
	textFiles = [
		"eula.txt": "eula=true\n",
		"server.properties": serverProperties(shardPort, "Wurst test (Shard)"),
		"ops.json": "[]\n",
		"config/bStats/config.yml": "enabled: false\n",
		"plugins/bStats/config.yml": "enabled: false\n",
		// its AI check needs Shard's paid API (user: don't enable it); no
		// telemetry or punishment sync with Shard's panel either
		"plugins/Shard/config.yml": shardConfig("config.yml")
			.replaceFirst(/(?m)^(ai:\s*\n(?:\s*#[^\n]*\n)*\s*enabled:)\s*true/, "\$1 false")
			.replaceFirst(/(?m)^(telemetry:\s*\n(?:\s*#[^\n]*\n)*\s*enabled:)\s*true/, "\$1 false")
			.replaceFirst(/(?m)^(\s+punishments:)\s*sync/, "\$1 off"),
		// logging only: no kicks, no bans
		"plugins/Shard/punishments.yml": shardConfig("punishments.yml")
			.replaceAll(/(?m)^\s*- "(kick|tempban|ban)\b[^"]*"\s*\n/, ""),
		// strictest mitigation rules: act on any AI signal at once. (Moot
		// with the AI check off - every rule reads its probability, buffer
		// and score - but set anyway.)
		"plugins/Shard/mitigations.yml": shardConfig("mitigations.yml")
			.replaceAll(/(probability: \{ above: )[0-9.]+/, "\$10.01")
			.replaceAll(/(\b(?:buffer|score|answers): \{ above: )[0-9.]+/, "\$10")
			.replaceAll(/(for-seconds: )\d+/, "\$10")
			.replaceAll(/(delay-seconds: )\d+/, "\$10")
	]
	outputs.upToDateWhen { false }
}

// no mods at all: what a vanilla server sees of the client (VanillaSpoof)
def prepareVanillaServer = tasks.register("prepareVanillaServer", PrepareTestServer) {
	dependsOn downloadFabricServer
	useServer = useVanilla
	serverDir = new File(anticheatDir, "vanilla")
	serverJar.from(downloadFabricServer.flatMap { it.destination })
	serverJarName = "fabric-server.jar"
	addonDir = "mods"
	patchGrim = false
	freshDirs = ["world", "logs"]
	textFiles = [
		"eula.txt": "eula=true\n",
		"server.properties": serverProperties(vanillaPort, "Wurst test (vanilla)"),
		"ops.json": "[]\n"
	]
	outputs.upToDateWhen { false }
}

tasks.named("runClientGameTest") {
	dependsOn prepareGrimServer, prepareIntaveServer, prepareVanillaServer,
		prepareWindfallServer, prepareShardServer
}

loom {
	runs {
		clientGameTest {
			if(useGrim)
				vmArg("-Dwurst.test.grimServer=${new File(anticheatDir, "grim").absolutePath}:${grimPort}")
			if(useIntave)
				vmArg("-Dwurst.test.intaveServer=${new File(anticheatDir, "intave").absolutePath}:${intavePort}")
			if(useVanilla)
				vmArg("-Dwurst.test.vanillaServer=${new File(anticheatDir, "vanilla").absolutePath}:${vanillaPort}")
			if(useWindfall)
				vmArg("-Dwurst.test.windfallServer=${new File(anticheatDir, "windfall").absolutePath}:${windfallPort}")
			if(useShard)
				vmArg("-Dwurst.test.shardServer=${new File(anticheatDir, "shard").absolutePath}:${shardPort}")
			// every hack and command takes ~10 min per server
			if(providers.gradleProperty("noFeatureSweep").isPresent())
				vmArg("-Dwurst.test.noFeatureSweep=true")
			// -PfromInventory: test items in the main inventory, not the
			// hotbar (hacks open the inventory to fetch them)
			if(providers.gradleProperty("fromInventory").isPresent())
				vmArg("-Dwurst.test.fromInventory=true")
			// training pauses while the test client runs (TrainerHold);
			// -PkeepTraining leaves it running
			if(!providers.gradleProperty("keepTraining").isPresent())
				vmArg("-Dwurst.test.trainScript=${file("scripts/train.ps1").absolutePath}")
			// -Pfeatures=blink,criticals: only those features' tests
			def features = providers.gradleProperty("features").getOrNull()
			if(features)
				vmArg("-Dwurst.test.features=$features")
		}
	}
}
