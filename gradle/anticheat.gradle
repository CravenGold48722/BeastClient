abstract class DownloadFile extends DefaultTask
{
	@Input
	abstract Property<String> getUrl()

	@Input
	@Optional
	abstract Property<String> getSha256()

	@OutputFile
	abstract RegularFileProperty getDestination()

	@TaskAction
	void download()
	{
		File dest = destination.get().asFile
		File part = new File(dest.path + ".part")
		dest.parentFile.mkdirs()
		new URL(url.get()).openStream().withCloseable { input ->
			part.withOutputStream { it << input }
		}
		if(sha256.isPresent())
		{
			String actual = java.security.MessageDigest.getInstance("SHA-256")
				.digest(part.bytes).encodeHex().toString()
			if(actual != sha256.get())
				throw new GradleException("Bad download of " + url.get()
					+ ": sha256 " + actual)
		}
		java.nio.file.Files.move(part.toPath(), dest.toPath(),
			java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

