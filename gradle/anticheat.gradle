// ── Server folders ──

abstract class PrepareTestServer extends DefaultTask
{
	@Input
	abstract Property<Boolean> getUseServer()

	@Internal
	abstract DirectoryProperty getServerDir()

	@InputFiles
	abstract ConfigurableFileCollection getServerJar()

	@Input
	abstract Property<String> getServerJarName()

	@InputFiles
	abstract ConfigurableFileCollection getAddons()

	@Input
	abstract Property<String> getAddonDir()

	@Input
	abstract Property<Boolean> getPatchGrim()

	@Input
	abstract MapProperty<String, String> getTextFiles()

	@Input
	abstract ListProperty<String> getFreshDirs()

	@TaskAction
	void prepare()
	{
		if(!useServer.get())
			return

		File dir = serverDir.get().asFile
		dir.mkdirs()
		freshDirs.get().each { new File(dir, it).deleteDir() }

		new File(dir, serverJarName.get()).bytes = serverJar.singleFile.bytes

		File addonsDir = new File(dir, addonDir.get())
		addonsDir.mkdirs()
		addonsDir.listFiles()?.findAll { it.name.endsWith(".jar") }*.delete()
		addons.files.each { jar ->
			byte[] bytes = jar.bytes
			if(patchGrim.get() && jar.name.startsWith("grimac"))
				bytes = GrimJarPatch.patch(bytes)
			new File(addonsDir, jar.name).bytes = bytes
		}

		textFiles.get().each { path, text ->
			File file = new File(dir, path)
			file.parentFile.mkdirs()
			file.setText(text, "UTF-8")
		}
	}
}

/**
 * The one change the test copy of Grim needs: the cloud command library it
 * bundles asks for Minecraft 26.2, and Fabric then leaves it out on 26.1.2 -
 * Grim says 26.1.2 is fine. Without it, Grim runs without its commands.
 */
class GrimJarPatch
{
	static final java.util.regex.Pattern NESTED =
		~/META-INF\/jars\/(grimac-|cloud-fabric-)[^\/]*\.jar/

	static byte[] patch(byte[] jar)
	{
		def out = new ByteArrayOutputStream()
		new java.util.zip.ZipInputStream(new ByteArrayInputStream(jar)).withCloseable { zin ->
			new java.util.zip.ZipOutputStream(out).withCloseable { zout ->
				def entry
				while((entry = zin.nextEntry) != null)
				{
					byte[] data = zin.readAllBytes()
					if(entry.name == "fabric.mod.json")
						data = patchModJson(new String(data, "UTF-8"))
							.getBytes("UTF-8")
					else if(NESTED.matcher(entry.name).matches())
						data = patch(data)
					zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
					zout.write(data)
					zout.closeEntry()
				}
			}
		}
		return out.toByteArray()
	}

	static String patchModJson(String json)
	{
		// some are written with ">=" escaped; same JSON either way (built
		// from pieces: Groovy reads backslash-u escapes in the source itself,
		// even inside a regex)
		String bs = "\\"
		json = json.replace(bs + "u003e", ">").replace(bs + "u003d", "=")
		return json.replaceAll(/"minecraft"\s*:\s*">=26\.2"/,
			'"minecraft": ">=26.1.2"')
	}
}

def serverProperties = { int port, String motd ->
	"""online-mode=false
server-ip=127.0.0.1
server-port=${port}
motd=${motd}
level-name=world
level-type=minecraft\\:flat
generate-structures=false
spawn-protection=0
difficulty=easy
gamemode=survival
view-distance=6
simulation-distance=6
max-tick-time=-1
enforce-secure-profile=false
sync-chunk-writes=false
"""
}

def prepareGrimServer = tasks.register("prepareGrimServer", PrepareTestServer) {
	dependsOn buildGrim, downloadFabricServer
	useServer = useGrim
	serverDir = new File(anticheatDir, "grim")
	serverJar.from(downloadFabricServer.flatMap { it.destination })
	serverJarName = "fabric-server.jar"
	addons.from(configurations.anticheatFabricApi)
	addons.from(fileTree(new File(grimSource, "fabric/build/libs")) {
		include "grimac-fabric-*.jar"
		exclude "grimac-fabric-official-*", "grimac-fabric-intermediary-*",
			"grimac-fabric-mc*"
	})
	// VexBot (see build.gradle): AimAssist (Auto combo) fights one of its bots
	if(project.vexbotJar.isFile())
		addons.from(project.vexbotJar)
	addonDir = "mods"
	patchGrim = true
	freshDirs = ["world", "logs"]
	textFiles = [
		"eula.txt": "eula=true\n",
		"server.properties": serverProperties(grimPort, "Wurst test (Grim)"),
		"ops.json": "[]\n",
		// no usage statistics sent from test runs
		"config/bStats/config.yml": "enabled: false\n",
		"plugins/bStats/config.yml": "enabled: false\n",
		"vexbot_settings.json": '{"global": {"statsOn": false}}\n',
		// every flag in the console, not only alerts past a threshold;
		// every check at its strictest (user, 2026-11-04: "ABSOLUTE MAX
		// AGGRESSIVENESS") - see grimMaxAggressive
		"config/GrimAC/config.yml": useGrim
			? grimMaxAggressive(new File(grimSource, "common/src/main/resources/config/en.yml")
				.getText("UTF-8").replaceFirst(/(?m)^verbose:\s*\n(\s*)print-to-console: false/,
					"verbose:\n\$1print-to-console: true")
				.replaceFirst(/(?m)^check-for-updates: true/, "check-for-updates: false"))
			: ""
	]
	outputs.upToDateWhen { false }
}

def prepareIntaveServer = tasks.register("prepareIntaveServer", PrepareTestServer) {
	dependsOn buildIntave, downloadPaperServer
	useServer = useIntave
	serverDir = new File(anticheatDir, "intave")
	serverJar.from(downloadPaperServer.flatMap { it.destination })
	serverJarName = "paper.jar"
	addons.from(new File(intaveSource, "build/libs/Intave-bundled.jar"))
	addonDir = "plugins"
	patchGrim = false
	freshDirs = ["world", "world_nether", "world_the_end", "logs",
		"plugins/Intave/logs"]
	textFiles = [
		"eula.txt": "eula=true\n",
		"server.properties": serverProperties(intavePort, "Wurst test (Intave)"),
		"ops.json": "[]\n",
		// no usage statistics sent from test runs
		"config/bStats/config.yml": "enabled: false\n",
		"plugins/bStats/config.yml": "enabled: false\n",
		// logging only: no kicks, no bans; the advanced config (below) is the
		// one in force
		"plugins/Intave/config.yml": useIntave
			? new File(intaveSource, "src/main/resources/config.yml")
				.getText("UTF-8")
				.replaceFirst(/(?ms)^kick-commands:\s*\n(\s+-[^\n]*\n)+/, "kick-commands: []\n")
				.replaceFirst(/(?ms)^ban-commands:\s*\n(\s+-[^\n]*\n)+/, "ban-commands: []\n")
				.replaceFirst(/(?m)^config:\s*\S+/, "config: ADVANCED")
				.replaceFirst(/(?m)^physics-mm:\s*\S+/, "physics-mm: AGGRESSIVE")
			: "",
		// strictest (user, 2026-11-04: "ABSOLUTE MAX AGGRESSIVENESS")
		"plugins/Intave/advanced.yml": useIntave
			? intaveMaxAggressive(new File(intaveSource, "src/main/resources/advanced.yml")
				.getText("UTF-8"))
			: "",
		// Intave's strictest trust level for everyone (it takes the first
		// intave.trust.* permission a player has; the bot isn't op)
		"permissions.yml": "intave.trust.darkred:\n  default: true\n"
	]
	outputs.upToDateWhen { false }
}

