// ── Anticheat servers for the gametests ─────────────────────────────────
// The gametests also join two real servers, each in its own process, and
// collect every flag their anticheat raises:
//
//   Grim    - GrimAC on a Fabric 26.1.2 server, built from its source in
//             ../Testing (-PgrimDir=...)
//   Intave  - Intave on a Paper 26.1.2 server, built from its source in
//             ../Testing2 (-PintaveDir=...)
//   Windfall - Windfall on Paper 26.1.2 (with the packetevents plugin), built
//             with Maven from ../Testing3 (-PwindfallDir=...)
//   Shard   - Shard on Paper 26.1.2, built from ../Testing4 (-PshardDir=...),
//             its AI check off (it needs Shard's paid API) and nothing sent to
//             Shard's panel
//
// A source folder that isn't there leaves its server out; -PnoAnticheat
// leaves them all out. Each server lives in build/anticheat/<name>; its world
// is made fresh every run, the downloaded game files are kept. The test bot
// isn't op (Intave gives ops its bypass trust factor) - except on Windfall,
// which exempts nobody for it and only logs a player's flags to the console
// after they turned their own alerts off (/windfall alerts, an op command).
// None of them kicks or bans - the servers only log.

def anticheatDir = layout.buildDirectory.dir("anticheat").get().asFile
def noAnticheat = providers.gradleProperty("noAnticheat").isPresent()
def grimSource = file(providers.gradleProperty("grimDir").getOrElse("../Testing"))
def intaveSource = file(providers.gradleProperty("intaveDir").getOrElse("../Testing2"))
def useGrim = !noAnticheat && grimSource.isDirectory()
def useIntave = !noAnticheat && intaveSource.isDirectory()
def windfallSource = file(providers.gradleProperty("windfallDir").getOrElse("../Testing3"))
def shardSource = file(providers.gradleProperty("shardDir").getOrElse("../Testing4"))
def useWindfall = !noAnticheat && windfallSource.isDirectory()
def useShard = !noAnticheat && shardSource.isDirectory()
// a plain server (Fabric's launcher, no mods = vanilla) for VanillaSpoof
def useVanilla = !noAnticheat

def grimPort = 25571
def intavePort = 25572
def vanillaPort = 25573
def windfallPort = 25574
def shardPort = 25575

// ── Strictest settings (user, 2026-11-04: "make sure all of them are set to
// as aggressive as possible, ABSOLUTE MAX AGGRESSIVENESS") ──
// Detection, setbacks and cancels at their strictest; kicks and bans stay off
// (they'd only end the session - the flags are what the tests read).

// Grim: offsets flagged from 0.0001 blocks (0.001), setback/cancel on the
// first violation, no VL decay, no timer drift allowance, no reach
// expansion + the extra post-tick reach probe, experimental checks, no
// sprint-jumping with an elytra (vanilla netcode Grim calls an exploit), no
// building on ghost blocks
// -PgrimTimerAllowance keeps Grim's timer drift/ping allowance at the
// default (diagnosis): with 0 ms, scheduling and network jitter alone flag
// Timer on any client (97 flags on joining, 2026-11-04), and each flag's
// setback then shows up as Simulation/AntiKB flags in whatever runs next.
def grimKeepsTimerAllowance = providers.gradleProperty("grimTimerAllowance").isPresent()
def grimMaxAggressive = { String yml ->
	if(!grimKeepsTimerAllowance)
		yml = yml.replaceAll(/(?m)^(\s+drift:) \d+/, "\$1 0")
			.replaceAll(/(?m)^(\s+ping-abuse-limit-threshold:) \d+/, "\$1 0")
	yml.replaceAll(/(?m)^(\s+threshold:) 0\.001\s*$/, "\$1 0.0001")
		.replaceAll(/(?m)^(\s+immediate-setback-threshold:) [0-9.]+/, "\$1 0.0001")
		.replaceAll(/(?m)^(\s+max-advantage:) [0-9.]+/, "\$1 0.0001")
		.replaceAll(/(?m)^(\s+max-ceiling:) [0-9.]+/, "\$1 0.0001")
		.replaceAll(/(?m)^(\s+setback-decay-multiplier:) [0-9.]+/, "\$1 1")
		.replaceAll(/(?m)^(\s+setbackvl:) \d+/, "\$1 0")
		.replaceAll(/(?m)^(\s+cancelvl:) \d+/, "\$1 0")
		.replaceAll(/(?m)^(\s+decay:) [0-9.]+/, "\$1 0")
		.replaceAll(/(?m)^(\s+threshold:) 0\.0005\s*$/, "\$1 0")
		.replaceAll(/(?m)^(\s+enable-post-packet:) false/, "\$1 true")
		.replaceAll(/(?m)^(\s+allow-sprint-jumping-when-using-elytra:) true/, "\$1 false")
		.replaceAll(/(?m)^(\s+allow-building-on-ghostblocks:) true/, "\$1 false")
		.replaceAll(/(?m)^(\s+distance-to-check-if-ghostblocks:) \d+/, "\$1 4")
		.replaceAll(/(?m)^experimental-checks: false/, "experimental-checks: true")
		.replaceAll(/(?m)^(max-ping-out-of-flying:) \d+/, "\$1 50")
		.replaceAll(/(?m)^(max-ping-firework-boost:) \d+/, "\$1 50")
}

// Intave (advanced config): AGGRESSIVE physics mitigation (default
// BARELY), placement timings checked, the lowest rotation and blink limits,
// every detection logged (verbose ALL, not only mitigated ones); its kick/ban
// macros become log entries
def intaveMaxAggressive = { String yml ->
	yml.replaceAll(/(?m)^(\s+mitigation:) \S+/, "\$1 AGGRESSIVE")
		.replaceAll(/(?m)^(\s+check_timings:) false/, "\$1 true")
		.replaceAll(/(?m)^(\s+rotation-limit:) \d+/, "\$1 1500")
		.replaceAll(/(?m)^(\s+blink-limit:) \d+/, "\$1 1")
		.replaceAll(/(?m)^(\s+verbose-mode:) \S+/, "\$1 ALL")
		.replace('$kick$', 'intave internals storelog {player} {check} {vl}')
		.replace('$ban$', 'intave internals storelog {player} {check} {vl}')
}

def windows = System.getProperty("os.name").toLowerCase().contains("windows")
def gradlewIn = { File dir ->
	windows ? ["cmd", "/c", new File(dir, "gradlew.bat").absolutePath]
		: [new File(dir, "gradlew").absolutePath]
}

// ── Building the anticheats ──

def buildGrim = tasks.register("buildGrim", Exec) {
	onlyIf { useGrim }
	workingDir grimSource
	commandLine(gradlewIn(grimSource))
	args(":fabric:jar", "--console=plain", "-q")
	// only rebuilt when Grim's source changes
	inputs.files(fileTree(grimSource) {
		exclude "**/build/**", "**/.gradle/**", "**/run/**", ".idea/**"
	})
	outputs.dir(new File(grimSource, "fabric/build/libs"))
}

// Intave's build stamps the git commit into its version and fails without a
// repository; a stub one here keeps its folder untouched.
def intaveGit = new File(anticheatDir, "intave-git")
def buildIntave = tasks.register("buildIntave", Exec) {
	onlyIf { useIntave }
	workingDir intaveSource
	commandLine(gradlewIn(intaveSource))
	// (gradle/geyser-snapshot-init.gradle: a Geyser snapshot that's gone)
	args("shadowJar", "--console=plain", "-q", "--no-configuration-cache",
		"--init-script", file("gradle/geyser-snapshot-init.gradle").absolutePath)
	environment("GIT_DIR", new File(intaveGit, ".git").absolutePath)
	inputs.files(fileTree(intaveSource) {
		include "src/main/**", "*.gradle.kts", "gradle.properties", "gradle/**"
	})
	outputs.file(new File(intaveSource, "build/libs/Intave-bundled.jar"))
	doFirst {
		if(new File(intaveGit, ".git").isDirectory())
			return
		intaveGit.mkdirs()
		["git", "init", "-q"].execute(null, intaveGit).waitFor()
		["git", "-c", "user.name=stub", "-c", "user.email=stub@localhost",
			"commit", "-q", "--allow-empty", "-m", "stub for Intave's build"]
			.execute(null, intaveGit).waitFor()
	}
}

// Windfall builds with Maven, which isn't installed: a pinned copy here
def mavenHome = new File(anticheatDir, "maven/apache-maven-3.9.9")
def unpackMaven = tasks.register("unpackMaven", Copy) {
	onlyIf { useWindfall }
	dependsOn "downloadMaven"
	from({ zipTree(new File(anticheatDir, "downloads/apache-maven-3.9.9-bin.zip")) })
	into new File(anticheatDir, "maven")
}
def buildWindfall = tasks.register("buildWindfall", Exec) {
	onlyIf { useWindfall }
	dependsOn unpackMaven
	workingDir windfallSource
	commandLine(windows
		? ["cmd", "/c", new File(mavenHome, "bin/mvn.cmd").absolutePath]
		: [new File(mavenHome, "bin/mvn").absolutePath])
	// no "obfuscate" profile: ProGuard only renames
	args("-B", "-q", "package", "-DskipTests")
	environment("JAVA_HOME", System.getProperty("java.home"))
	inputs.files(fileTree(windfallSource) { include "src/main/**", "pom.xml" })
	outputs.file(new File(windfallSource, "target/Windfall.jar"))
}

// Shard's Floodgate API snapshot needs a Geyser snapshot no repository has
// any more - gradle/geyser-snapshot-init.gradle leaves it out (Shard's
// folder untouched)
def buildShard = tasks.register("buildShard", Exec) {
	onlyIf { useShard }
	workingDir shardSource
	commandLine(gradlewIn(shardSource))
	args("shadowJar", "--console=plain", "-q", "--no-configuration-cache",
		"--init-script", file("gradle/geyser-snapshot-init.gradle").absolutePath)
	inputs.files(fileTree(shardSource) {
		include "src/main/**", "src/packetevents/**", "*.gradle.kts",
			"gradle.properties", "gradle/**", "buildSrc/src/**"
	})
	outputs.dir(new File(shardSource, "build/libs"))
}

